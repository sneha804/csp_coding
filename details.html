<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scheme Finder - User Details</title>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:#eef8ff;
    color:#123d70;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:74px;
    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 32px;

    border-bottom:1px solid #dfeaf4;

    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:1000;
}


/* =========================================================
   HEADER LEFT
========================================================= */

.header-left{
    display:flex;
    align-items:center;
    gap:18px;
}


/* =========================================================
   LOGO
========================================================= */

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-emblem{
    width:43px;
    height:53px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-emblem img{
    width:40px;
    height:50px;

    object-fit:contain;
    display:block;
}

.logo-text{
    font-size:29px;
    font-weight:700;
    color:#06427f;
}


/* =========================================================
   HEADER RIGHT
========================================================= */

.header-right{
    display:flex;
    align-items:center;
    gap:22px;
}


/* =========================================================
   INDIA FLAG + LANGUAGE DROPDOWN
========================================================= */

.language-selector{
    height:42px;

    min-width:150px;

    padding:0 10px;

    display:flex;
    align-items:center;

    gap:9px;

    background:#ffffff;

    border:1px solid #d8e3ef;

    border-radius:22px;

    box-shadow:0 2px 6px rgba(0,0,0,.04);

    transition:.2s;
}


/* REAL INDIAN FLAG */

.india-flag{
    width:32px;
    height:22px;

    object-fit:cover;

    display:block;

    flex-shrink:0;
}


/* LANGUAGE SELECT */

.language-selector select{
    border:none;

    outline:none;

    background:transparent;

    color:#123d70;

    font-family:"Segoe UI", Arial, sans-serif;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    padding:2px 4px;

    flex:1;
}

.language-selector select option{
    color:#123d70;

    background:#ffffff;

    font-size:14px;
}


/* HOVER */

.language-selector:hover{
    border-color:#2581df;

    box-shadow:
        0 3px 10px rgba(37,129,223,.10);
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notification{
    position:relative;

    font-size:21px;

    color:#174d88;

    cursor:pointer;
}

.notification .dot{
    position:absolute;

    width:9px;
    height:9px;

    background:#ed334d;

    border-radius:50%;

    top:-2px;
    right:-3px;

    border:1px solid white;
}


/* =========================================================
   PROFILE
========================================================= */

.profile{
    display:flex;

    align-items:center;

    gap:10px;

    color:#123e72;

    font-size:16px;

    font-weight:600;
}

.profile-circle{
    width:43px;
    height:43px;

    border-radius:50%;

    background:#e8f4ff;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#075db5;

    font-size:20px;
}

.profile .arrow{
    font-size:11px;

    margin-left:3px;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    padding-top:74px;

    min-height:100vh;

    background:
        linear-gradient(
            135deg,
            #eaf7ff 0%,
            #f4fbff 48%,
            #e7f5ff 100%
        );

    position:relative;

    overflow:hidden;
}


/* BACKGROUND CIRCLES */

.main::before{
    content:"";

    position:absolute;

    width:470px;
    height:470px;

    left:-300px;
    bottom:-230px;

    border-radius:50%;

    background:rgba(36,117,207,.08);
}

.main::after{
    content:"";

    position:absolute;

    width:390px;
    height:390px;

    right:-200px;
    bottom:-200px;

    border-radius:50%;

    background:rgba(39,128,219,.07);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    position:relative;

    z-index:2;

    margin:32px 30px 40px;

    background:#ffffff;

    border-radius:14px;

    min-height:843px;

    padding:0 40px 34px;

    box-shadow:
        0 5px 25px rgba(30,96,155,.08);
}


/* =========================================================
   PAGE HEADING
========================================================= */

.page-heading{
    height:150px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:5px 8px 0 0;
}

.heading-left{
    display:flex;

    align-items:center;

    gap:20px;
}

.heading-icon{
    width:82px;
    height:82px;

    border-radius:50%;

    background:#e2f1ff;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#0968c7;

    font-size:38px;
}

.heading-text h1{
    font-size:32px;

    color:#07457f;

    font-weight:700;

    margin-bottom:7px;
}

.heading-text p{
    color:#617b99;

    font-size:17px;
}


/* =========================================================
   ILLUSTRATION
========================================================= */

.illustration{
    width:280px;
    height:120px;

    position:relative;

    overflow:hidden;
}

.illustration .circle{
    position:absolute;

    width:115px;
    height:90px;

    right:55px;
    top:12px;

    border-radius:50%;

    background:#dceeff;
}

.illustration .circle2{
    position:absolute;

    width:105px;
    height:80px;

    right:0;
    top:27px;

    border-radius:50%;

    background:#d6ecff;
}


/* =========================================================
   LAPTOP
========================================================= */

.laptop{
    position:absolute;

    right:10px;
    bottom:9px;

    width:105px;
    height:58px;

    background:#0d4b89;

    border-radius:5px 5px 2px 2px;

    transform:skew(-5deg);
}

.laptop::after{
    content:"";

    position:absolute;

    bottom:-7px;
    left:-12px;

    width:130px;
    height:7px;

    background:#7eafd6;

    border-radius:5px;
}

.screen{
    position:absolute;

    width:72px;
    height:43px;

    background:#d9efff;

    top:7px;
    left:17px;

    border-radius:3px;
}


/* =========================================================
   PERSON
========================================================= */

.person-head{
    position:absolute;

    right:100px;
    top:21px;

    width:31px;
    height:31px;

    border-radius:50%;

    background:#f3bd91;
}

.person-hair{
    position:absolute;

    right:94px;
    top:10px;

    width:47px;
    height:50px;

    background:#101c42;

    border-radius:50% 50% 35% 35%;

    transform:rotate(-8deg);
}

.person-body{
    position:absolute;

    right:78px;
    bottom:7px;

    width:75px;
    height:65px;

    background:#0871d7;

    border-radius:38px 38px 8px 8px;

    transform:rotate(4deg);
}


/* =========================================================
   PLANT
========================================================= */

.plant{
    position:absolute;

    left:16px;
    bottom:7px;

    width:65px;
    height:75px;
}

.stem{
    position:absolute;

    left:30px;
    bottom:0;

    width:4px;
    height:62px;

    background:#2181c7;
}

.leaf{
    position:absolute;

    width:25px;
    height:14px;

    background:#1593dd;

    border-radius:100% 0 100% 0;
}

.leaf.one{
    left:30px;
    top:24px;

    transform:rotate(-35deg);
}

.leaf.two{
    left:8px;
    top:40px;

    transform:rotate(30deg);
}

.leaf.three{
    left:35px;
    top:45px;

    transform:rotate(-30deg);
}


/* =========================================================
   FORM SECTION
========================================================= */

.form-section{
    border:1px solid #dceaf5;

    border-radius:13px;

    margin-bottom:23px;

    overflow:hidden;

    background:white;

    box-shadow:
        0 2px 8px rgba(22,88,140,.04);
}


/* SECTION TITLE */

.section-title{
    height:47px;

    background:#eaf5ff;

    display:flex;

    align-items:center;

    gap:15px;

    padding:0 20px;

    color:#0754a0;

    font-size:16px;

    font-weight:700;
}

.section-title i{
    font-size:23px;
}


/* FORM BODY */

.form-body{
    padding:22px 20px 23px;
}


/* =========================================================
   GRID
========================================================= */

.grid-3{
    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:30px;
}

.grid-2{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:38px;
}


/* =========================================================
   FIELD
========================================================= */

.field{
    display:flex;

    flex-direction:column;

    gap:9px;
}

.field label{
    color:#143d70;

    font-size:14px;

    font-weight:600;
}

.required{
    color:#e53948;
}


/* =========================================================
   INPUT BOX
========================================================= */

.input-box{
    height:46px;

    border:1px solid #ccdce9;

    border-radius:8px;

    background:white;

    display:flex;

    align-items:center;

    padding:0 14px;

    color:#8a9db2;

    transition:.2s;
}

.input-box i{
    color:#315b87;

    width:27px;

    font-size:17px;
}

.input-box input,
.input-box select{
    flex:1;

    width:100%;

    height:100%;

    border:none;

    outline:none;

    background:transparent;

    color:#6f8298;

    font-family:inherit;

    font-size:13px;
}

.input-box select{
    cursor:pointer;
}

.input-box:focus-within{
    border-color:#2581df;

    box-shadow:
        0 0 0 2px rgba(37,129,223,.08);
}

.select-arrow{
    color:#50708f !important;

    width:auto !important;

    font-size:12px !important;
}


/* =========================================================
   BUTTON
========================================================= */

.button-row{
    display:flex;

    justify-content:flex-end;

    margin-top:5px;
}

.find-button{
    width:300px;

    height:54px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #0874e8,
            #1479e8
        );

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;

    box-shadow:
        0 5px 12px rgba(16,112,220,.18);

    transition:.2s;
}

.find-button:hover{
    transform:translateY(-1px);

    box-shadow:
        0 7px 15px rgba(16,112,220,.25);
}

.find-button i{
    font-size:20px;
}


/* SAVE LINK */

.save-link{
    color:white;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1000px){

    .header{
        padding:0 20px;
    }

    .header-right{
        gap:15px;
    }

    .profile span{
        display:none;
    }

    .grid-3{
        grid-template-columns:1fr 1fr;
    }
}


/* =========================================================
   850px
========================================================= */

@media(max-width:850px){

    .content{
        margin:25px 20px;

        padding:0 25px 30px;
    }

    .grid-3{
        grid-template-columns:1fr;
    }

    .grid-2{
        grid-template-columns:1fr;

        gap:20px;
    }

    .illustration{
        display:none;
    }

    .heading-text h1{
        font-size:27px;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{
        padding:0 15px;
    }

    .header-right{
        gap:10px;
    }

    .language-selector{
        min-width:115px;

        height:38px;

        padding:0 7px;
    }

    .india-flag{
        width:27px;
        height:19px;
    }

    .language-selector select{
        font-size:12px;
    }

    .notification{
        display:none;
    }

    .profile span{
        display:none;
    }

    .content{
        margin:15px;

        padding:0 15px 25px;
    }

    .page-heading{
        height:auto;

        padding:20px 0;
    }

    .heading-icon{
        width:60px;
        height:60px;

        font-size:27px;
    }

    .heading-text h1{
        font-size:23px;
    }

    .heading-text p{
        font-size:13px;
    }

    .button-row{
        justify-content:stretch;
    }

    .find-button{
        width:100%;
    }

    .logo-text{
        font-size:22px;
    }
}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media(max-width:400px){

    .logo-emblem{
        width:35px;
    }

    .logo-emblem img{
        width:34px;
        height:44px;
    }

    .logo-text{
        font-size:19px;
    }

    .language-selector{
        min-width:100px;
    }

    .india-flag{
        width:25px;
        height:17px;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">


    <!-- LEFT -->

    <div class="header-left">

        <div class="logo">


            <!-- EMBLEM OF INDIA -->

            <div class="logo-emblem">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg"
                    alt="Emblem of India"
                >

            </div>


            <!-- SCHEME FINDER -->

            <div class="logo-text">

                Scheme Finder

            </div>

        </div>

    </div>



    <!-- =====================================================
         RIGHT HEADER
    ====================================================== -->

    <div class="header-right">


        <!-- INDIA FLAG + LANGUAGE -->

        <div class="language-selector">


            <img
                class="india-flag"
                src="https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg"
                alt="India Flag"
            >


            <select
                id="languageSelect"
                onchange="changeLanguage()"
            >

                <option value="English">
                    English
                </option>

                <option value="Telugu">
                    తెలుగు
                </option>

                <option value="Hindi">
                    हिन्दी
                </option>

                <option value="Tamil">
                    தமிழ்
                </option>

                <option value="Kannada">
                    ಕನ್ನಡ
                </option>

                <option value="Malayalam">
                    മലയാളം
                </option>

                <option value="Marathi">
                    मराठी
                </option>

                <option value="Bengali">
                    বাংলা
                </option>

            </select>

        </div>



        <!-- NOTIFICATION -->

        <div class="notification">

            <i class="fa-regular fa-bell"></i>

            <span class="dot"></span>

        </div>



        <!-- PROFILE -->

        <div class="profile">

            <div class="profile-circle">

                <i class="fa-regular fa-user"></i>

            </div>

            <span>
                Sneha
            </span>

            <i class="fa-solid fa-chevron-down arrow"></i>

        </div>


    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


    <div class="content">


        <!-- =================================================
             PAGE HEADING
        ================================================== -->

        <div class="page-heading">


            <div class="heading-left">


                <div class="heading-icon">

                    <i class="fa-regular fa-user"></i>

                </div>


                <div class="heading-text">

                    <h1>
                        Tell Us About Yourself
                    </h1>

                    <p>
                        Help us understand your profile so we can
                        find the best schemes for you.
                    </p>

                </div>


            </div>



            <!-- ILLUSTRATION -->

            <div class="illustration">

                <div class="circle"></div>

                <div class="circle2"></div>

                <div class="person-hair"></div>

                <div class="person-head"></div>

                <div class="person-body"></div>

                <div class="laptop">

                    <div class="screen"></div>

                </div>

                <div class="plant">

                    <div class="stem"></div>

                    <div class="leaf one"></div>

                    <div class="leaf two"></div>

                    <div class="leaf three"></div>

                </div>

            </div>

        </div>



        <!-- =================================================
             PERSONAL INFORMATION
        ================================================== -->

        <section class="form-section">


            <div class="section-title">

                <i class="fa-regular fa-circle-user"></i>

                <span>
                    Personal Information
                </span>

            </div>


            <div class="form-body">


                <div class="grid-3">


                    <!-- FULL NAME -->

                    <div class="field">

                        <label>
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                            >

                        </div>

                    </div>



                    <!-- AGE -->

                    <div class="field">

                        <label>
                            Age
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-calendar"></i>

                            <input
                                type="number"
                                id="age"
                                placeholder="Enter your age"
                            >

                        </div>

                    </div>



                    <!-- GENDER -->

                    <div class="field">

                        <label>
                            Gender
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <select id="gender">

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                            <i class="fa-solid fa-chevron-down select-arrow"></i>

                        </div>

                    </div>


                </div>

            </div>

        </section>



        <!-- =================================================
             LOCATION
        ================================================== -->

        <section class="form-section">


            <div class="section-title">

                <i class="fa-solid fa-location-dot"></i>

                <span>
                    Location
                </span>

            </div>


            <div class="form-body">


                <div class="grid-2">


                    <!-- STATE -->

                    <div class="field">

                        <label>
                            State
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-location-dot"></i>

                            <select id="state">

                                <option value="">
                                    Select state
                                </option>

                                <option value="Andhra Pradesh">
                                    Andhra Pradesh
                                </option>

                                <option value="Telangana">
                                    Telangana
                                </option>

                                <option value="Karnataka">
                                    Karnataka
                                </option>

                                <option value="Tamil Nadu">
                                    Tamil Nadu
                                </option>

                                <option value="Maharashtra">
                                    Maharashtra
                                </option>

                            </select>

                            <i class="fa-solid fa-chevron-down select-arrow"></i>

                        </div>

                    </div>



                    <!-- DISTRICT -->

                    <div class="field">

                        <label>
                            District
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-building"></i>

                            <select id="district">

                                <option value="">
                                    Select district
                                </option>

                                <option value="Krishna">
                                    Krishna
                                </option>

                                <option value="Guntur">
                                    Guntur
                                </option>

                                <option value="Vijayawada">
                                    Vijayawada
                                </option>

                                <option value="Visakhapatnam">
                                    Visakhapatnam
                                </option>

                            </select>

                            <i class="fa-solid fa-chevron-down select-arrow"></i>

                        </div>

                    </div>


                </div>

            </div>

        </section>



        <!-- =================================================
             BACKGROUND
        ================================================== -->

        <section class="form-section">


            <div class="section-title">

                <i class="fa-solid fa-graduation-cap"></i>

                <span>
                    Background
                </span>

            </div>


            <div class="form-body">


                <div class="grid-3">


                    <!-- EDUCATION -->

                    <div class="field">

                        <label>
                            Education
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-graduation-cap"></i>

                            <select id="education">

                                <option value="">
                                    Select education level
                                </option>

                                <option value="School">
                                    School
                                </option>

                                <option value="Intermediate">
                                    Intermediate
                                </option>

                                <option value="Diploma">
                                    Diploma
                                </option>

                                <option value="Undergraduate">
                                    Undergraduate
                                </option>

                                <option value="Postgraduate">
                                    Postgraduate
                                </option>

                            </select>

                            <i class="fa-solid fa-chevron-down select-arrow"></i>

                        </div>

                    </div>



                    <!-- OCCUPATION -->

                    <div class="field">

                        <label>
                            Occupation
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-briefcase"></i>

                            <select id="occupation">

                                <option value="">
                                    Select occupation
                                </option>

                                <option value="Student">
                                    Student
                                </option>

                                <option value="Employed">
                                    Employed
                                </option>

                                <option value="Unemployed">
                                    Unemployed
                                </option>

                                <option value="Entrepreneur">
                                    Entrepreneur
                                </option>

                                <option value="Job Seeker">
                                    Job Seeker
                                </option>

                            </select>

                            <i class="fa-solid fa-chevron-down select-arrow"></i>

                        </div>

                    </div>



                    <!-- INCOME -->

                    <div class="field">

                        <label>
                            Annual Income
                            <span class="required">*</span>
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-indian-rupee-sign"></i>

                            <select id="income">

                                <option value="">
                                    Select income range
                                </option>

                                <option value="Below ₹1 Lakh">
                                    Below ₹1 Lakh
                                </option>

<script>

/* =========================================================
   LANGUAGE DROPDOWN
========================================================= */

function changeLanguage(){

    const language =
        document.getElementById(
            "languageSelect"
        ).value;

    if(language !== "English"){

        alert(
            "Language selected: " + language
        );

    }

}


/* =========================================================
   FIND SCHEMES
========================================================= */

function findSchemes(){

    const name =
        document.getElementById(
            "fullName"
        ).value.trim();

    const age =
        document.getElementById(
            "age"
        ).value.trim();

    const gender =
        document.getElementById(
            "gender"
        ).value;

    const state =
        document.getElementById(
            "state"
        ).value;

    const district =
        document.getElementById(
            "district"
        ).value;

    const education =
        document.getElementById(
            "education"
        ).value;

    const occupation =
        document.getElementById(
            "occupation"
        ).value;

    const income =
        document.getElementById(
            "income"
        ).value;


    /* VALIDATION */

    if(
        name === "" ||
        age === "" ||
        gender === "" ||
        state === "" ||
        district === "" ||
        education === "" ||
        occupation === "" ||
        income === ""
    ){

        alert(
            "Please fill in all required details."
        );

        return;
    }


    /* SAVE USER DETAILS */

    localStorage.setItem(
        "userName",
        name
    );

    localStorage.setItem(
        "userAge",
        age
    );

    localStorage.setItem(
        "userGender",
        gender
    );

    localStorage.setItem(
        "userState",
        state
    );

    localStorage.setItem(
        "userDistrict",
        district
    );

    localStorage.setItem(
        "userEducation",
        education
    );

    localStorage.setItem(
        "userOccupation",
        occupation
    );

    localStorage.setItem(
        "userIncome",
        income
    );


    alert(
        "Your details have been saved successfully!"
    );

}

</script>
